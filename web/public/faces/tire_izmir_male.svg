    <polygon points="300,335 262,420 300,510"/>
    <polygon points="300,335 338,420 300,510"/>
    <polygon points="262,420 338,420 300,510"/>
    <circle cx="230" cy="260" r="4" fill="#34d399"/>
    <circle cx="370" cy="260" r="4" fill="#34d399"/>
    <circle cx="300" cy="335" r="4" fill="#34d399"/>
    <circle cx="300" cy="420" r="4" fill="#34d399"/>
    <circle cx="300" cy="510" r="4" fill="#34d399"/>
