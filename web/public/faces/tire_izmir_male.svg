  <circle cx="227" cy="257" r="3" fill="#ffffff"/>
  <circle cx="367" cy="257" r="3" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 300 250 L 300 335 Q 280 345 275 335" fill="none" stroke="#a06e57" stroke-width="3" stroke-linecap="round"/>
  <path d="M 300 335 Q 320 345 325 335" fill="none" stroke="#a06e57" stroke-width="3" stroke-linecap="round"/>

