<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_154" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="skinGrad_154" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebcdb4"/>
      <stop offset="100%" stop-color="#b8866b"/>
    </linearGradient>
    <filter id="shadow_154">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#111827"/>
